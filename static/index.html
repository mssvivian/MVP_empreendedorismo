<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FilaZero CLT — MVP Gestão de Filas</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-logo">FZ</div>
        <div>
          <div class="brand-title">FilaZero</div>
          <div class="brand-sub">Arthur Monteiro, Carolina Falcão, Fernando Bruzzi &amp; Vivian Souza</div>
        </div>
      </div>

      <nav class="nav-tabs" id="navTabs">
        <button class="nav-tab active" data-view="split">Visão Geral (Demo)</button>
        <button class="nav-tab" data-view="clt">App CLT</button>
        <button class="nav-tab" data-view="restaurant">Restaurante</button>
        <button class="nav-tab" data-view="metrics">Métricas Canvas</button>
        <button class="nav-tab" data-view="arch">Arquitetura</button>
      </nav>

      <div class="top-actions">
        <button class="btn btn-outline btn-sm" id="btnThemeToggle" title="Alternar tema Claro / Escuro">
          🌙 Escuro
        </button>
        <button class="btn btn-outline btn-sm" id="btnResetDemo" title="Restaurar dados iniciais">
          ↺ Resetar
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="appRoot"></div>
  </main>

  <div class="toast-container" id="toastContainer"></div>

  <script src="/app.js"></script>
</body>
</html>
