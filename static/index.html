<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CLTempo — Gestão Inteligente de Filas Corporativas</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Topbar / Header de Controle da Plataforma -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand" onclick="switchMainView('client')" style="cursor:pointer;">
        <div class="brand-logo">CLT</div>
        <div>
          <div class="brand-title">CLTempo</div>
          <div class="brand-sub">Empreendedorismo • UFRJ 2026.2</div>
        </div>
      </div>

      <!-- Seletor das Três Interfaces + Demonstração -->
      <nav class="nav-tabs" id="navTabs">
        <button class="nav-tab active" data-view="client">📱 App Cliente</button>
        <button class="nav-tab" data-view="restaurant">🧑‍🍳 Restaurante</button>
        <button class="nav-tab" data-view="admin">📊 Administrador</button>
        <button class="nav-tab" data-view="split">⚡ Demonstração (Split)</button>
      </nav>

      <div class="top-actions">
        <button class="btn btn-outline btn-sm" id="btnThemeToggle" title="Alternar tema Claro / Escuro">
          🌙 Escuro
        </button>
        <button class="btn btn-outline btn-sm" id="btnResetDemo" title="Restaurar dados iniciais do piloto">
          ↺ Resetar
        </button>
      </div>
    </div>
  </header>

  <!-- Container Principal -->
  <main class="container">
    <div id="appRoot"></div>
  </main>

  <!-- Notificações Toast -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Modal Global (para Detalhes do Restaurante, Google Maps e Ações) -->
  <div id="modalOverlay" class="modal-overlay" style="display:none;" onclick="closeModalOnOverlay(event)">
    <div class="modal-container" id="modalContainer"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
